<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0d1117">
  <meta name="description" content="GitHub初心者のための、やさしい30語の用語集。アルファベット順・検索対応。">
  <title>GitHub はじめて用語集</title>
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main-content">本文へ移動</a>
  <header class="hero">
    <div class="hero__inner">
      <div class="eyebrow"><span aria-hidden="true">⌘</span> BEGINNER GLOSSARY</div>
      <h1>GitHub はじめて用語集</h1>
      <p class="hero__lead">画面に突然現れる英単語を、初心者向けの日本語と具体例で整理しました。</p>

      <div class="search-panel" role="search">
        <label for="search">用語を検索</label>
        <div class="search-box">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m21 21-4.35-4.35m2.35-5.65a8 8 0 1 1-16 0 8 8 0 0 1 16 0Z"/></svg>
          <input id="search" type="search" autocomplete="off" placeholder="例：branch、公開、プルリクエスト">
          <button id="clear-search" type="button" hidden aria-label="検索語を消す">消去</button>
        </div>
        <div class="search-meta">
          <p id="result-count" aria-live="polite">30 / 30語</p>
          <p>英語・読み方・説明・例から検索できます</p>
        </div>
      </div>

      <nav id="alphabet-nav" class="alphabet-nav" aria-label="頭文字から探す"></nav>
    </div>
  </header>

  <main id="main-content" class="main-content">
    <div id="empty-state" class="empty-state" hidden>
      <p class="empty-state__mark" aria-hidden="true">?</p>
      <h2>一致する用語がありません</h2>
      <p>別の英単語や日本語で検索してください。</p>
    </div>
    <div id="glossary-list"></div>
  </main>

  <footer>
    <p>初心者向けに意味を簡略化しています。厳密な操作では公式ドキュメントも確認してください。</p>
    <p>© <span id="year"></span> GitHub はじめて用語集</p>
  </footer>
</body>
</html>
