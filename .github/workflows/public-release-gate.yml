name: Public Release Check

on:
  pull_request:
    paths:
      - '.github/workflows/public-release-gate.yml'
      - 'public_browser_test.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-release-gate:
    runs-on: ubuntu-latest
    env:
      PUBLIC_URL: https://soutarounaka1016-max.github.io/D/
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install Playwright
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium webkit
      - name: Verify current public release
        run: python public_browser_test.py
