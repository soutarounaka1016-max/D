name: Rename repository

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rename-repository.yml'

permissions:
  contents: read

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - name: Rename repository to github-glossary
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.request('PATCH /repos/{owner}/{repo}', {
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'github-glossary'
            });
            core.info('Repository renamed to github-glossary');
